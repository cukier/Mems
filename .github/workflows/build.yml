name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          # espressif/idf has no "master" tag on Docker Hub; "latest" is the
          # tag that actually tracks the master branch (matches the local
          # dev install this project is built/tested against).
          esp_idf_version: latest
          target: esp32c3
          path: src/Mems
          command: idf.py build

      - name: Upload firmware (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lsm6ds3_reader-esp32c3
          path: |
            src/Mems/build/*.bin
            src/Mems/build/*.elf
            src/Mems/build/*.map
            src/Mems/build/flasher_args.json
            src/Mems/build/bootloader/bootloader.bin
            src/Mems/build/partition_table/partition-table.bin
          if-no-files-found: error

      # Actions artifacts above expire in 90 days and need a GitHub login to
      # download — fine for CI debugging, not for "flash this on your board"
      # links. This rolling release is the public, permanent download point
      # (see README's "Flashing a prebuilt binary" section): every push to
      # main re-publishes the same "esp32c3-latest" tag with the freshly
      # built flashable binaries.
      - name: Publish rolling firmware release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp32c3-latest
          name: ESP32-C3 firmware (latest build)
          body: |
            Automatically rebuilt and republished on every push to `main`
            (commit ${{ github.sha }}). Flashing instructions: see the
            README's "Flashing a prebuilt binary" section.
          make_latest: true
          files: |
            src/Mems/build/lsm6ds3_reader.bin
            src/Mems/build/bootloader/bootloader.bin
            src/Mems/build/partition_table/partition-table.bin
            src/Mems/build/flasher_args.json
