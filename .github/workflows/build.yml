name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          # espressif/idf has no "master" tag on Docker Hub; "latest" is the
          # tag that actually tracks the master branch (matches the local
          # dev install this project is built/tested against).
          esp_idf_version: latest
          target: esp32c3
          path: src/Mems
          command: idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: lsm6ds3_reader-esp32c3
          path: |
            src/Mems/build/*.bin
            src/Mems/build/*.elf
            src/Mems/build/*.map
            src/Mems/build/flasher_args.json
            src/Mems/build/bootloader/bootloader.bin
            src/Mems/build/partition_table/partition-table.bin
          if-no-files-found: error
